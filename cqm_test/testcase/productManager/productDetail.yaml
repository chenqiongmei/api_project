baseInfo:
  api_name: 商品详情
  url: /coupApply/cms/productDetail
  method: post
  header:
    Content-Type: application/json;charset=UTF-8
#    token: ${get_extract_data(Token)}
#    token: ${get_extract_data(cookie,session)}
testCase:
  - case_name: 获取商品详情
    json:
      pro_id: ${get_extract_data(goodsId,0)}  # c_debugtalk.py下，0 随机读取列表1条
      page: 1
      size: 20
    validation:
      - contains: { 'error_code': '0000' }