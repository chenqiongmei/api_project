[pytest]
# 全局命令行参数配置
# -vs: 详细输出并打印(解决单进程中文详细输出)
# --alluredir ./report/temp: 生成Allure原始测试数据到指定目录
# -p no:warnings: 屏蔽pytest自身警告(图中被遮挡部分)
# --clean-alluredir: 运行前清空历史Allure数据
# 注：如需并行提速，可在此行末尾添加 -n 3 (但会导致中文打印折叠乱序)
addopts = -vs --alluredir ./report/temp -p no:warnings --clean-alluredir

# 测试用例搜索路径（指定运行 ./testcase/ 目录下的用例）
testpaths = ./testcase/

# 警告过滤规则配置
# error: 将警告视为错误（严格模式）
# ignore::UserWarning: 忽略用户自定义警告，防止干扰日志
filterwarnings =
    error
    ignore::UserWarning

# 测试用例发现规则（文件名、类名、函数名匹配）
# 匹配 test_开头.py结尾的文件
python_files = test_*.py
# 匹配 Test开头 的类
python_classes = Test*
# 匹配 test开头 的函数/方法
python_functions = test

markers =
    mock: 冒烟测试
    manager: 用户管理
    usermanager: 用户管理模块分组用例







